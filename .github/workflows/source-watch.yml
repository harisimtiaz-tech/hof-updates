name: Immigration Source Check

on:
  schedule:
    # 04:00 UTC Monday = 9:00 AM PKT, so the report is waiting at the start of the week
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check and print, send no email)?"
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]
      report_to:
        description: "Who receives the report"
        required: true
        default: "harisimtiaz@hofmigration.com"
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check the rules still work
        run: node selftest.js
      - run: node watch.js
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          # On the Monday schedule there are no inputs, so these are empty and the run
          # sends for real. A manual run can still choose a dry run.
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REPORT_TO: ${{ inputs.report_to || 'harisimtiaz@hofmigration.com' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check
          path: source-check.html
